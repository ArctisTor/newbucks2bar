<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucks2Bar</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="mb-2">Bucks2Bar - Budget Tracker</h1>
      <hr class="title-divider" />

      <form id="usernameForm" class="mb-4">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="Enter username"
          pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{5,}"
          title="Must contain at least 1 uppercase letter, 1 number, 1 special character, and be at least 5 characters long"
          aria-describedby="usernameRequirements"
          required
        />
        <div
          class="form-text text-danger d-none"
          id="usernameRequirements"
          aria-live="polite"
        >
          Must contain at least 1 uppercase letter, 1 number, 1 special
          character, and be at least 5 characters long
        </div>
        <button
          type="submit"
          class="btn btn-pink mt-2"
          id="submitUsername"
          disabled
        >
          Submit
        </button>
        <button
          type="button"
          class="btn btn-gray mt-2 ms-2"
          id="clearUsername"
        >
          Clear
        </button>
      </form>

      <!-- Tab Navigation -->
      <div class="d-flex align-items-stretch border-bottom">
        <ul class="nav nav-tabs flex-grow-1 border-0" id="myTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="data-tab"
              data-bs-toggle="tab"
              data-bs-target="#data"
              type="button"
              role="tab"
              aria-controls="data"
              aria-selected="true"
            >
              Data
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="chart-tab"
              data-bs-toggle="tab"
              data-bs-target="#chart"
              type="button"
              role="tab"
              aria-controls="chart"
              aria-selected="false"
            >
              Chart
            </button>
          </li>
        </ul>
      </div>

      <!-- Tab Content -->
      <div class="tab-content" id="myTabContent">
        <!-- Data Tab -->
        <div
          class="tab-pane fade show active"
          id="data"
          role="tabpanel"
          aria-labelledby="data-tab"
        >
          <div class="d-flex justify-content-end align-items-center pt-3">
            <label for="currencySelect" class="form-label small mb-0 me-2">
              Currency
            </label>
            <div class="currency-search">
              <input
                type="search"
                id="currencySelect"
                class="form-control form-control-sm"
                value="USD"
                placeholder="Search currency"
                aria-label="Search and select currency"
                aria-autocomplete="list"
                aria-controls="currencyOptions"
                aria-expanded="false"
                role="combobox"
                autocomplete="off"
              />
              <div
                id="currencyOptions"
                class="currency-options d-none"
                role="listbox"
                aria-label="Currency options"
              ></div>
            </div>
          </div>
          <div class="mt-4">
            <form id="budgetForm">
              <div class="row mb-3">
                <div class="col-md-4"><strong>Month</strong></div>
                <div class="col-md-4">
                  <strong>Income (<span id="incomeCurrencyLabel">$</span>)</strong>
                </div>
                <div class="col-md-4">
                  <strong>Expenses (<span id="expenseCurrencyLabel">$</span>)</strong>
                </div>
              </div>

              <!-- January -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-jan" class="form-label">January</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-jan"
                    min="0"
                    step="0.01"
                    value="750"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-jan"
                    min="0"
                    step="0.01"
                    value="520"
                  />
                </div>
              </div>

              <!-- February -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-feb" class="form-label">February</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-feb"
                    min="0"
                    step="0.01"
                    value="680"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-feb"
                    min="0"
                    step="0.01"
                    value="450"
                  />
                </div>
              </div>

              <!-- March -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-mar" class="form-label">March</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-mar"
                    min="0"
                    step="0.01"
                    value="920"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-mar"
                    min="0"
                    step="0.01"
                    value="780"
                  />
                </div>
              </div>

              <!-- April -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-apr" class="form-label">April</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-apr"
                    min="0"
                    step="0.01"
                    value="850"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-apr"
                    min="0"
                    step="0.01"
                    value="620"
                  />
                </div>
              </div>

              <!-- May -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-may" class="form-label">May</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-may"
                    min="0"
                    step="0.01"
                    value="990"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-may"
                    min="0"
                    step="0.01"
                    value="710"
                  />
                </div>
              </div>

              <!-- June -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-jun" class="form-label">June</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-jun"
                    min="0"
                    step="0.01"
                    value="560"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-jun"
                    min="0"
                    step="0.01"
                    value="380"
                  />
                </div>
              </div>

              <!-- July -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-jul" class="form-label">July</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-jul"
                    min="0"
                    step="0.01"
                    value="800"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-jul"
                    min="0"
                    step="0.01"
                    value="590"
                  />
                </div>
              </div>

              <!-- August -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-aug" class="form-label">August</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-aug"
                    min="0"
                    step="0.01"
                    value="720"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-aug"
                    min="0"
                    step="0.01"
                    value="540"
                  />
                </div>
              </div>

              <!-- September -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-sep" class="form-label">September</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-sep"
                    min="0"
                    step="0.01"
                    value="880"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"

                    id="expense-sep"
                    min="0"

                    value="650"
                  />
                </div>
              </div>

              <!-- October -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-oct" class="form-label">October</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-oct"
                    min="0"
                    step="0.01"
                    value="640"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-oct"
                    min="0"
                    step="0.01"
                    value="470"
                  />
                </div>
              </div>

              <!-- November -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-nov" class="form-label">November</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-nov"
                    min="0"
                    step="0.01"
                    value="760"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-nov"

                    step="0.01"
                    value="580"
                  />
                </div>
              </div>

              <!-- December -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-dec" class="form-label">December</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-dec"
                    min="0"
                    step="0.01"
                    value="950"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-dec"
                    min="0"
                    step="0.01"
                    value="820"
                  />
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Chart Tab -->
        <div
          class="tab-pane fade"
          id="chart"
          role="tabpanel"
          aria-labelledby="chart-tab"
        >
          <div class="mt-4">
            <!-- download button -->
            <button
              id="downloadChart"
              class="btn btn-pink mb-3"
              type="button"
              aria-label="Download chart as PNG"
            >
              Download PNG
            </button>
            <canvas id="budgetChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
  </body>
</html>
