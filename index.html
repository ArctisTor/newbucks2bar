<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucks2Bar</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="mb-4">Bucks2Bar - Budget Tracker</h1>

      <!-- Tab Navigation -->
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="data-tab"
            data-bs-toggle="tab"
            data-bs-target="#data"
            type="button"
            role="tab"
            aria-controls="data"
            aria-selected="true"
          >
            Data
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="chart-tab"
            data-bs-toggle="tab"
            data-bs-target="#chart"
            type="button"
            role="tab"
            aria-controls="chart"
            aria-selected="false"
          >
            Chart
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="myTabContent">
        <!-- Data Tab -->
        <div
          class="tab-pane fade show active"
          id="data"
          role="tabpanel"
          aria-labelledby="data-tab"
        >
          <div class="mt-4">
            <form id="budgetForm">
              <div class="row mb-3">
                <div class="col-md-4"><strong>Month</strong></div>
                <div class="col-md-4"><strong>Income ($)</strong></div>
                <div class="col-md-4"><strong>Expenses ($)</strong></div>
              </div>

              <!-- January -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-jan" class="form-label">January</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-jan"
                    min="0"
                    step="0.01"
                    value="750"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-jan"
                    min="0"
                    step="0.01"
                    value="520"
                  />
                </div>
              </div>

              <!-- February -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-feb" class="form-label">February</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-feb"
                    min="0"
                    step="0.01"
                    value="680"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-feb"
                    min="0"
                    step="0.01"
                    value="450"
                  />
                </div>
              </div>

              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-mar" class="form-label">March</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-mar"
                    min="0"
                    step="0.01"
                    value="920"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-mar"
                    min="0"
                    step="0.01"
                    value="780"
                  />
                </div>
              </div>

              <!-- April -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-apr" class="form-label">April</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-apr"
                    min="0"
                    step="0.01"
                    value="850"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-apr"
                    min="0"
                    step="0.01"
                    value="620"

              </div>

                    min="0"
                    step="0.01"
                    value="990"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-may"
                    min="0"
                    step="0.01"
                    value="710"
                  />
                </div>
              </div>

              <!-- June -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-jun" class="form-label">June</label>
                </div>
                <div class="col-md-4">
                  <input

                    class="form-control income-input"
                    id="income-jun"
                    min="0"
                    step="0.01"

                <div class="col-md-4">
                  <input

                    id="expense-jun"

                    step="0.01"
                    value="380"

                    id="income-aug"

                    step="0.01"

                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-aug"
                    min="0"
                    step="0.01"
                    value="540"
                  />
                </div>
              </div>

              <!-- September -->
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="income-sep" class="form-label">September</label>
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control income-input"
                    id="income-sep"
                    min="0"
                    step="0.01"
                    value="880"
                  />
                </div>
                <div class="col-md-4">
                  <input

              <!-- October -->

                <div class="col-md-4">

                <div class="col-md-4">

                    min="0"

                    value="950"
                  />
                </div>
                <div class="col-md-4">
                  <input
                    type="number"
                    class="form-control expense-input"
                    id="expense-dec"
                    min="0"
                    step="0.01"
                    value="820"
                  />
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Chart Tab -->
        <div
          class="tab-pane fade"
          id="chart"
          role="tabpanel"
          aria-labelledby="chart-tab"
        >
          <div class="mt-4">
            <!-- download button -->
            <button id="downloadChart" class="btn btn-primary mb-3">
              Download
            </button>
            <canvas id="budgetChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
  </body>
</html>
